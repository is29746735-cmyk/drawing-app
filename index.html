<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbfa">
  <title>보관함</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // 야간 모드 설정을 화면이 그려지기 전에 먼저 적용 (깜빡임 방지)
    try {
      const t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="top">
    <h1 id="box-title">보관함</h1>
    <button class="pill-btn" id="box-add-btn">+ 추가</button>
    <button class="pill-btn" id="box-list-btn">목록</button>
    <button class="icon-btn" id="menu-btn" aria-label="메뉴">⋯</button>
  </header>

  <nav class="seg" role="tablist">
    <button role="tab" data-tab="idea">아이디어</button>
    <button role="tab" data-tab="ref">자료</button>
  </nav>

  <div class="caps" id="caps"></div>

  <main id="list"></main>

  <!-- 화면 가운데 끝의 작은 화살표: 누르면 옆 칸으로 -->
  <button class="edge-arrow right" id="go-ref" data-go-tab="ref" aria-label="자료 칸으로"><span>›</span></button>
  <button class="edge-arrow left" id="go-idea" data-go-tab="idea" aria-label="아이디어 칸으로"><span>‹</span></button>

  <div class="dock">
    <button class="fab" id="add-btn">+ 담기</button>
  </div>

  <!-- 담기 / 수정 -->
  <dialog id="sheet" class="full">
    <form method="dialog" id="sheet-form" novalidate>
      <header class="bar">
        <button type="button" class="text-btn" data-close>취소</button>
        <h2 id="sheet-title">새로 담기</h2>
        <button type="submit" class="text-btn strong" id="sheet-save">담기</button>
      </header>
      <div class="sheet-body">
        <div class="seg small" id="kind-seg">
          <button type="button" data-kind="idea">아이디어</button>
          <button type="button" data-kind="ref">자료</button>
        </div>

        <label class="field">
          <span id="text-label">그리고 싶은 장면이나 문장</span>
          <textarea id="text" rows="4" placeholder="비 오는 버스 정류장, 우산 없이 웃는 사람"></textarea>
        </label>

        <div class="field" id="photo-field">
          <span>사진</span>
          <div class="photos" id="photos"></div>
          <label class="pick" id="pick">
            <input type="file" id="file" accept="image/*" multiple hidden>
            + 사진 고르기
          </label>
          <p class="hint" id="photo-hint"></p>
        </div>

        <div class="field">
          <span>태그</span>
          <div class="caps wrap" id="tag-pick"></div>
          <div class="new-tag">
            <input id="new-tag" placeholder="새 태그 이름" maxlength="12" enterkeyhint="done">
            <button type="button" class="chip-btn" id="new-tag-btn">추가</button>
          </div>
        </div>

        <p class="error" id="sheet-error" role="alert"></p>
      </div>
      <footer class="sheet-foot">
        <button type="button" class="ghost" data-close>취소</button>
        <button type="submit" class="solid" id="sheet-save-bottom">담기</button>
      </footer>
    </form>
  </dialog>

  <!-- 아이디어 자세히 보기 -->
  <dialog id="detail" class="full">
    <header class="bar">
      <button type="button" class="text-btn" data-close>닫기</button>
      <h2></h2>
      <button type="button" class="text-btn" id="detail-edit">수정</button>
    </header>
    <div class="detail-body" id="detail-body"></div>
    <div class="bottom-actions">
      <button type="button" class="danger-btn" id="detail-delete">삭제</button>
    </div>
  </dialog>

  <!-- 사진 크게 보기 -->
  <dialog id="viewer" class="full dark">
    <div class="stage" id="stage"><img id="viewer-img" alt=""></div>
    <header class="bar over">
      <button type="button" class="text-btn" data-close>닫기</button>
      <span class="pos" id="viewer-pos"></span>
      <span></span>
    </header>
    <footer class="viewer-foot" id="viewer-foot">
      <div class="caps" id="viewer-tags"></div>
      <p class="viewer-note" id="viewer-note"></p>
      <div class="viewer-actions">
        <button type="button" class="text-btn" id="viewer-edit">수정</button>
        <button type="button" class="text-btn danger" id="viewer-delete">삭제</button>
      </div>
    </footer>
  </dialog>

  <!-- 보관함 목록 -->
  <dialog id="box-list" class="sheet-up">
    <h2>보관함 목록</h2>
    <ul class="box-rows" id="box-rows"></ul>
    <button type="button" class="text-btn" data-close>닫기</button>
  </dialog>

  <!-- 보관함 이름 짓기 (새로 만들기 / 이름 바꾸기 같이 씀) -->
  <dialog id="box-name" class="sheet-up">
    <form id="box-name-form" novalidate>
      <h2 id="box-name-title">새 보관함</h2>
      <input id="box-name-input" class="name-input" maxlength="20" placeholder="손 연습, 배경 모음" enterkeyhint="done">
      <p class="error" id="box-name-error" role="alert"></p>
      <div class="sheet-foot plain">
        <button type="button" class="ghost" data-close>취소</button>
        <button type="submit" class="solid" id="box-name-save">만들기</button>
      </div>
    </form>
  </dialog>

  <!-- 인터넷 창고 연결 -->
  <dialog id="sync-dlg" class="sheet-up">
    <form id="sync-form" novalidate>
      <h2>인터넷 창고 연결</h2>
      <p class="hint">Turso 데이터베이스 주소와 토큰을 넣어요. 토큰은 이 폰에만 저장돼요.</p>
      <label class="field small-field">
        <span>주소</span>
        <input id="sync-url" class="name-input" placeholder="libsql://drawing-app-이름.turso.io"
          autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
      </label>
      <label class="field small-field">
        <span>토큰</span>
        <input id="sync-token" class="name-input" type="password" placeholder="Turso에서 만든 토큰 붙여넣기"
          autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <p class="error" id="sync-error" role="alert"></p>
      <div class="sheet-foot plain">
        <button type="button" class="ghost" data-close>취소</button>
        <button type="submit" class="solid" id="sync-save">연결하기</button>
      </div>
    </form>
  </dialog>

  <!-- 메뉴 -->
  <dialog id="menu" class="sheet-up">
    <h2>메뉴</h2>
    <p class="hint" id="usage"></p>
    <button type="button" class="menu-item" id="export-btn">백업 파일로 내보내기</button>
    <label class="menu-item">
      백업 파일 불러오기
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </label>
    <h3>인터넷 창고 (Turso)</h3>
    <p class="hint sync-line" id="sync-status"></p>
    <div class="sync-actions">
      <button type="button" class="chip-btn" id="sync-connect">연결하기</button>
      <button type="button" class="chip-btn" id="sync-now" hidden>지금 맞추기</button>
      <button type="button" class="chip-btn" id="sync-off" hidden>연결 끊기</button>
    </div>
    <h3>화면 밝기</h3>
    <div class="seg small theme-seg" id="theme-seg">
      <button type="button" data-theme-pick="auto">폰 설정대로</button>
      <button type="button" data-theme-pick="light">밝게</button>
      <button type="button" data-theme-pick="dark">야간 모드</button>
    </div>
    <h3>태그 지우기</h3>
    <div class="caps wrap" id="tag-manage"></div>
    <button type="button" class="text-btn" data-close>닫기</button>
  </dialog>

  <div class="toast" id="toast" role="status" popover="manual"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
